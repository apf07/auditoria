services:
  - type: web
    name: auditoria
    runtime: docker
    plan: starter
    healthCheckPath: /health.php
    envVars:
      - key: AUDITORIA_USER
        sync: false
      - key: AUDITORIA_PASSWORD
        sync: false
      - key: AUDITORIA_ALLOWED_ORIGINS
        sync: false
    disk:
      name: auditoria-data
      mountPath: /var/data
      sizeGB: 1
